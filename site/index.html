<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>FeLo | TFeL Enterprises</title>
	<meta name="description" content="Official FeLo merch from TFeL Enterprises, plus Call of Duty coaching, streams and videos.">
	<meta name="theme-color" content="#ffffff">
	<meta property="og:title" content="FeLo | TFeL Enterprises">
	<meta property="og:description" content="Official FeLo merch, Call of Duty coaching, streams and videos.">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,0..100&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
	<a class="skip-link" href="#main">Skip to content</a>
	<div data-site-header></div>

	<main id="main" tabindex="-1">
		<!-- The lead collection comes from data/site.json ("featured"). Change it with scripts/feature.py. -->
		<section class="wrap feature" data-feature>
			<div class="feature__pic" data-feature-pic></div>
			<div class="feature__copy">
				<p class="eyebrow">TFeL Enterprises</p>
				<h1 class="display" data-feature-title>Man I Love FeLo</h1>
				<p class="lead" data-feature-line></p>
				<div class="feature__actions">
					<a class="btn" href="shop.html" data-feature-link>Shop the collection</a>
				</div>
			</div>
		</section>

		<section class="wrap section">
			<div class="section__head">
				<h2 class="section__title" data-feature-heading>The collection</h2>
				<a class="link-arrow" href="shop.html" data-feature-link>View all</a>
			</div>
			<div class="grid grid--5" data-feature-grid></div>
		</section>

		<section class="band">
			<div class="wrap section">
				<div class="section__head">
					<div>
						<h2 class="section__title" data-second-title>TFeL Enterprises Premium</h2>
						<p class="lead" style="margin-top: 8px" data-second-line></p>
					</div>
					<a class="link-arrow" href="shop.html" data-second-link>View all</a>
				</div>
				<div class="grid grid--3" data-second-grid></div>
			</div>
		</section>

		<section class="wrap section" style="padding-top: 56px">
			<div class="section__head">
				<h2 class="section__title">More collections</h2>
				<a class="link-arrow" href="shop.html">Shop all</a>
			</div>
			<div class="col-cards" data-more></div>
		</section>

		<section class="wrap">
			<div class="strip-cta" style="border-top: 1px solid var(--line)">
				<div>
					<h2 class="display">Call of Duty coaching</h2>
					<p class="lead">1-on-1 sessions and VOD reviews with FeLo, a competitive CoD player for 11 years.</p>
				</div>
				<div class="feature__actions">
					<a class="btn" href="coaching.html">See coaching</a>
					<a class="btn btn--ghost" href="watch.html">Watch streams</a>
				</div>
			</div>
		</section>
	</main>

	<div data-site-footer></div>
	<script type="module" src="js/pages/home.js"></script>
</body>
</html>
