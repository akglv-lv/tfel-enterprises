<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Product | TFeL Enterprises</title>
	<meta name="theme-color" content="#ffffff">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,0..100&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="product">
	<a class="skip-link" href="#main">Skip to content</a>
	<div data-site-header></div>

	<main id="main" tabindex="-1">
		<div class="wrap" data-product>
			<div class="product" aria-busy="true">
				<div class="product__media"><div class="product__main"></div></div>
				<div class="product__info"><p class="meta">Loading…</p></div>
			</div>
		</div>

		<section class="wrap section" data-related hidden>
			<div class="section__head">
				<h2 class="section__title">More from this collection</h2>
				<a class="link-arrow" href="shop.html" data-related-link>View all</a>
			</div>
			<div class="grid" data-related-grid></div>
		</section>
	</main>

	<div data-site-footer></div>
	<script type="module" src="js/pages/product.js"></script>
</body>
</html>
